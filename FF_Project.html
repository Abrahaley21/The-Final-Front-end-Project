
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cat Explorer | Discover Cats</title>
    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <!-- Custom CSS -->
    <link rel="stylesheet" href="FF_Project.css">
    <!-- JavaScript -->
    <script src="FF_project.js" defer></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🐱 Cat Explorer</a>
            <span class="text-white">Discover your next favorite cat</span>
        </div>
    </nav>
    <header class="hero text-center py-5">
        <div class="container">
            <h1 class="display-4 fw-bold">Welcome to Cat Explorer!</h1>
            <p class="lead">
                Discover adorable cats from around the world.
            </p>
            <button id="randomButton" class="btn btn-dark btn-lg">
                Discover a Cat 🐾
            </button>
        </div>
    </header>
    <main class="container py-5">
        <section class="text-center mb-4">
            <h2>Find Your Favorite Cat</h2>
            <p class="text-muted">
                Choose a category or discover random cats.
            </p>
            <div class="row justify-content-center g-2">
                <div class="col-12 col-md-6">
                    <select id="categorySelect" class="form-select">
                        <option value="">Random cats</option>
                    </select>
                </div>
                <div class="col-12 col-md-auto">
                    <button id="searchButton" class="btn btn-primary w-100">
                        Explore Cats
                    </button>
                </div>
            </div>
        </section>
        <div id="message" class="text-center my-4" role="status"
             aria-live="polite">
            Loading adorable cats...
        </div>
        <div id="catResults" class="row g-4">
            <!-- Cat cards appear here -->
        </div>
    </main>
    <footer class="text-center py-4 bg-dark text-white">
        <p class="mb-1">Made with ❤️ and The Cat API</p>
        <small>Front-end project · HTML, CSS, Bootstrap & JavaScript</small>
    </footer>
</body>
</html>
